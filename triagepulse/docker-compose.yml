version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triagepulse-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: triagepulse-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped
